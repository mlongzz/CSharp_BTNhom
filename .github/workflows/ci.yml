name: Bookstore CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore Bookstore.sln

      - name: Build
        run: dotnet build Bookstore.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Bookstore.sln --configuration Release --no-build
